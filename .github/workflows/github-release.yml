name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Theia module exports
        run: npm run verify:theia-exports
      - run: npm run release:github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}